<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2학기 학급임원선거 후보 신청서</title>
  
  <!-- Open Graph -->
  <meta property="og:title" content="2학기 학급임원선거 후보 신청서">
  <meta property="og:description" content="함께 만들고 신나게 자라는 우리 반 학급임원 신청서">
  <meta property="og:type" content="website">

  <!-- External CDN Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --bg-gradient: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
      --container-border: #a5d6a7;
      --badge-bg: #e8f5e9;
      --badge-text: #2e7d32;
      --badge-border: #81c784;
      --title-color: #1b5e20;
      --title-shadow: #c8e6c9;
      --card-bg: #f1f8e9;
      --card-border: #c8e6c9;
      --text-main: #1b5e20;
      --text-sub: #2e7d32;
      --accent-line: #4caf50;
      --box-bg: #f4fbf7;
      --box-border: #a5d6a7;
      --table-th-bg: #e8f5e9;
      --btn-gradient: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
      --btn-shadow: rgba(76, 175, 80, 0.3);
    }

    [data-theme="cyan"] {
      --bg-gradient: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
      --container-border: #80deea;
      --badge-bg: #e0f7fa;
      --badge-text: #00838f;
      --badge-border: #4dd0e1;
      --title-color: #006064;
      --title-shadow: #b2ebf2;
      --card-bg: #f7feff;
      --card-border: #b2ebf2;
      --text-main: #006064;
      --text-sub: #00838f;
      --accent-line: #00acc1;
      --box-bg: #f0fdfa;
      --box-border: #b2f5ea;
      --table-th-bg: #e0f7fa;
      --btn-gradient: linear-gradient(135deg, #00acc1 0%, #00838f 100%);
      --btn-shadow: rgba(0, 172, 193, 0.3);
    }

    [data-theme="lavender"] {
      --bg-gradient: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
      --container-border: #ce93d8;
      --badge-bg: #f3e5f5;
      --badge-text: #6a1b9a;
      --badge-border: #ba68c8;
      --title-color: #4a148c;
      --title-shadow: #e1bee7;
      --card-bg: #fcf4fc;
      --card-border: #e1bee7;
      --text-main: #4a148c;
      --text-sub: #6a1b9a;
      --accent-line: #ab47bc;
      --box-bg: #fbf5fc;
      --box-border: #ce93d8;
      --table-th-bg: #f3e5f5;
      --btn-gradient: linear-gradient(135deg, #ab47bc 0%, #6a1b9a 100%);
      --btn-shadow: rgba(171, 71, 188, 0.3);
    }

    [data-theme="navy"] {
      --bg-gradient: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
      --container-border: #90caf9;
      --badge-bg: #e3f2fd;
      --badge-text: #1565c0;
      --badge-border: #64b5f6;
      --title-color: #0d47a1;
      --title-shadow: #bbdefb;
      --card-bg: #f4f9ff;
      --card-border: #bbdefb;
      --text-main: #0d47a1;
      --text-sub: #1565c0;
      --accent-line: #1e88e5;
      --box-bg: #f0f7ff;
      --box-border: #90caf9;
      --table-th-bg: #e3f2fd;
      --btn-gradient: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
      --btn-shadow: rgba(30, 136, 229, 0.3);
    }

    [data-theme="coral"] {
      --bg-gradient: linear-gradient(135deg, #fbe9e7 0%, #ffccbc 100%);
      --container-border: #ffab91;
      --badge-bg: #fbe9e7;
      --badge-text: #d84315;
      --badge-border: #ff8a65;
      --title-color: #bf360c;
      --title-shadow: #ffccbc;
      --card-bg: #fff6f3;
      --card-border: #ffccbc;
      --text-main: #bf360c;
      --text-sub: #d84315;
      --accent-line: #ff7043;
      --box-bg: #fff8f6;
      --box-border: #ffab91;
      --table-th-bg: #fbe9e7;
      --btn-gradient: linear-gradient(135deg, #ff7043 0%, #d84315 100%);
      --btn-shadow: rgba(255, 112, 67, 0.3);
    }

    * {
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    body {
      background: var(--bg-gradient);
      margin: 0;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .theme-selector-bar {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 4px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .theme-selector-label {
      font-size: 0.85rem;
      font-weight: 800;
      color: #333;
      white-space: nowrap;
    }

    .theme-select {
      border: 1.5px solid #ccc;
      border-radius: 8px;
      padding: 2px 6px;
      font-size: 0.82rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      background-color: #fff;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background-color: #fff;
      border-radius: 18px;
      padding: 18px 14px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
      border: 3px solid var(--container-border);
    }

    .header {
      text-align: center;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      background-color: var(--badge-bg);
      color: var(--badge-text);
      font-weight: 800;
      font-size: 0.88rem;
      padding: 4px 10px;
      border-radius: 14px;
      margin-bottom: 6px;
      border: 1.5px dashed var(--badge-border);
    }

    .title {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--title-color);
      margin: 0;
      text-shadow: 1px 1px 0 var(--title-shadow);
      letter-spacing: -0.5px;
    }

    .info-card {
      background-color: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 10px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-sub);
      width: 100%;
    }

    .info-group {
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    input[type="text"], textarea {
      -webkit-appearance: none;
      appearance: none;
    }

    .info-input {
      border: none;
      border-bottom: 2px solid var(--accent-line);
      width: 35px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-main);
      outline: none;
      background: transparent;
      padding: 0 2px;
    }

    .name-input {
      width: 75px;
    }

    .role-selection {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      background-color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--container-border);
      white-space: nowrap;
      margin-top: 2px;
    }

    .role-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-sub);
    }

    .role-option {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .role-option input[type="radio"] {
      appearance: none;
      width: 15px;
      height: 15px;
      border: 2px solid var(--accent-line);
      border-radius: 50%;
      outline: none;
      margin: 0;
      cursor: pointer;
      position: relative;
    }

    .role-option input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 7px;
      height: 7px;
      background-color: var(--text-main);
      border-radius: 50%;
    }

    .intro-box {
      display: flex;
      align-items: center;
      background-color: var(--box-bg);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 12px;
      border: 1.5px solid var(--box-border);
      gap: 10px;
    }

    .intro-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .speech-bubble {
      font-size: 0.82rem;
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.35;
    }

    .pledge-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 1.5px solid var(--container-border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .pledge-table th {
      background-color: var(--table-th-bg);
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 800;
      width: 22%;
      padding: 8px 4px;
      border-bottom: 1px solid var(--card-border);
      border-right: 1.5px solid var(--container-border);
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }

    .pledge-table td {
      padding: 4px 8px;
      border-bottom: 1px solid var(--card-border);
      background-color: #fff;
    }

    .pledge-table tr:last-child td,
    .pledge-table tr:last-child th {
      border-bottom: none;
    }

    .pledge-textarea {
      width: 100%;
      height: 50px;
      border: none;
      outline: none;
      font-size: 0.88rem;
      line-height: 1.4;
      color: #333;
      background: transparent;
      resize: none;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-wrap: anywhere;
    }

    .speech-section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .speech-textarea {
      width: 100%;
      height: 230px;
      border: 1.5px solid var(--container-border);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.88rem;
      line-height: 1.5;
      color: #333;
      outline: none;
      resize: none;
      background-color: #fafafa;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-wrap: anywhere;
    }

    .submit-btn-wrapper {
      text-align: center;
      margin-top: 12px;
    }

    .submit-btn {
      background: var(--btn-gradient);
      color: #fff;
      font-size: 0.98rem;
      font-weight: 800;
      padding: 10px 24px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px var(--btn-shadow);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .img-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      padding: 20px 10px;
      overflow-y: auto;
    }

    .img-modal.active {
      display: block !important;
    }

    .modal-content {
      background-color: #fff;
      max-width: 450px;
      margin: 10px auto;
      padding: 16px;
      border-radius: 14px;
      text-align: center;
    }

    .modal-guide {
      font-size: 0.9rem;
      font-weight: 800;
      color: #00838f;
      margin-bottom: 10px;
    }

    .modal-img {
      width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .modal-btn-group {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .modal-close-btn, .modal-download-btn {
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .modal-download-btn {
      background-color: #4caf50;
      color: #fff;
      text-decoration: none;
    }

    .modal-close-btn {
      background-color: #eee;
      color: #333;
    }
  </style>
</head>
<body data-theme="sage">

  <div class="theme-selector-bar">
    <span class="theme-selector-label">🎨 디자인 테마 선택 :</span>
    <select class="theme-select" onchange="changeTheme(this.value)">
      <option value="sage" selected>🌿 세이지 그린</option>
      <option value="cyan">🌊 푸른 바다</option>
      <option value="lavender">🪻 라벤더 블룸</option>
      <option value="navy">🌊 모던 네이비</option>
      <option value="coral">🍑 워밀리 코랄</option>
    </select>
  </div>

  <div class="container" id="application-form">
    <div class="header">
      <div class="badge">🌊 함께 만들고 신나게 자라는 푸른 2학기 🌊</div>
      <h1 class="title">학급임원선거 후보 신청서</h1>
    </div>

    <div class="info-card">
      <div class="info-row">
        <div class="info-group">( <input type="text" class="info-input"> ) 학년</div>
        <div class="info-group">( <input type="text" class="info-input"> ) 반</div>
        <div class="info-group">이름 : <input type="text" class="info-input name-input"></div>
      </div>
      <div class="role-selection">
        <span class="role-title">지원 희망 :</span>
        <label class="role-option">
          <input type="radio" name="role" value="실장"> 실장
        </label>
        <label class="role-option">
          <input type="radio" name="role" value="부실장"> 부실장
        </label>
      </div>
    </div>

    <div class="intro-box">
      <div class="intro-icon">🐬</div>
      <div class="speech-bubble">
        학급 임원은 우리 반 친구들의 목소리에 귀 기울이고 함께 즐거운 교실을 만들어가는 소중한 자리입니다. 모두를 위해 실천할 <b>지혜롭고 멋진 약속</b>을 차근차근 적어봅시다!
      </div>
    </div>

    <table class="pledge-table">
      <tr>
        <th>공약 1</th>
        <td><textarea class="pledge-textarea" placeholder="첫 번째 공약을 자유롭게 적어보세요."></textarea></td>
      </tr>
      <tr>
        <th>공약 2</th>
        <td><textarea class="pledge-textarea" placeholder="두 번째 공약을 자유롭게 적어보세요."></textarea></td>
      </tr>
      <tr>
        <th>공약 3</th>
        <td><textarea class="pledge-textarea" placeholder="세 번째 공약을 자유롭게 적어보세요."></textarea></td>
      </tr>
    </table>

    <div class="speech-section">
      <div class="speech-section-title">
        ⭐ 공약과 함께 나의 다짐을 정리하여 연설문을 완성해 봅시다.
      </div>
      <textarea class="speech-textarea" placeholder="친구들 앞에서 발표할 연설문 내용을 자유롭게 작성해 봅시다."></textarea>
    </div>
  </div>

  <div class="submit-btn-wrapper">
    <button class="submit-btn" onclick="submitAndCapture()">
      <span>✨ 작성 완료 및 제출하기</span>
    </button>
  </div>

  <div id="imageModal" class="img-modal">
    <div class="modal-content">
      <div class="modal-guide">
        ✨ 신청서 이미지가 생성되었습니다!
      </div>
      <img id="resultImage" class="modal-img" alt="신청서 이미지">
      <div class="modal-btn-group">
        <a id="downloadLink" class="modal-download-btn" download="학급임원선거_신청서.png">📥 저장하기</a>
        <button class="modal-close-btn" onclick="closeModal()">닫기</button>
      </div>
    </div>
  </div>

  <script>
    function changeTheme(themeName) {
      document.body.setAttribute("data-theme", themeName);
    }

    function submitAndCapture() {
      const formElement = document.getElementById("application-form");
      const submitBtn = document.querySelector(".submit-btn");
      const originalText = submitBtn.innerHTML;

      submitBtn.innerHTML = "<span>⏳ 이미지 생성 중...</span>";

      // html2canvas 캡처 시 textarea 글자 잘림 방지 로직
      const textareas = formElement.querySelectorAll("textarea");
      const replacementDivs = [];

      textareas.forEach(ta => {
        const div = document.createElement("div");
        div.style.width = ta.offsetWidth + "px";
        div.style.height = ta.offsetHeight + "px";
        div.style.padding = window.getComputedStyle(ta).padding;
        div.style.fontSize = window.getComputedStyle(ta).fontSize;
        div.style.fontFamily = window.getComputedStyle(ta).fontFamily;
        div.style.lineHeight = window.getComputedStyle(ta).lineHeight;
        div.style.color = window.getComputedStyle(ta).color;
        div.style.backgroundColor = window.getComputedStyle(ta).backgroundColor;
        div.style.border = window.getComputedStyle(ta).border;
        div.style.borderRadius = window.getComputedStyle(ta).borderRadius;
        div.style.whiteSpace = "pre-wrap";
        div.style.wordBreak = "break-all";
        div.style.overflowWrap = "anywhere";
        div.style.boxSizing = "border-box";
        div.innerText = ta.value;

        ta.style.display = "none";
        ta.parentNode.insertBefore(div, ta);
        replacementDivs.push({ ta, div });
      });

      setTimeout(() => {
        html2canvas(formElement, {
          scale: 2,
          useCORS: true,
          backgroundColor: "#ffffff"
        }).then(canvas => {
          // 원복 작업
          replacementDivs.forEach(item => {
            item.ta.style.display = "";
            item.div.remove();
          });

          const imageDataUrl = canvas.toDataURL("image/png");
          const modal = document.getElementById("imageModal");
          const resultImg = document.getElementById("resultImage");
          const downloadLink = document.getElementById("downloadLink");

          resultImg.src = imageDataUrl;
          downloadLink.href = imageDataUrl;
          modal.classList.add("active");

          submitBtn.innerHTML = originalText;
        }).catch(err => {
          replacementDivs.forEach(item => {
            item.ta.style.display = "";
            item.div.remove();
          });
          alert("이미지 생성 중 오류가 발생했습니다.");
          submitBtn.innerHTML = originalText;
        });
      }, 150);
    }

    function closeModal() {
      document.getElementById("imageModal").classList.remove("active");
    }
  </script>
</body>
</html>
